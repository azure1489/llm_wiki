# csw-wiki.aworld.ltd → LLM Wiki 实例 #3 的 HTTP API
# nginx(base-nginx, bridge) 经 docker 网关 172.17.0.1 访问宿主 socat 公网端口 20029
# （socat 20029 → 127.0.0.1:20028 = 实例#3 API）。证书复用泛域名 *.aworld.ltd。
server {
    listen 80;
    server_name csw-wiki.aworld.ltd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name csw-wiki.aworld.ltd;

    ssl_certificate /data/www/nginx/cert/aworld.ltd_nginx/aworld.ltd.pem;
    ssl_certificate_key /data/www/nginx/cert/aworld.ltd_nginx/aworld.ltd.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://172.17.0.1:20029;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
